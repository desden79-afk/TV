<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TV Dashboard — Fase 1</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>TV Dashboard</h1>
    <nav class="tabs">
      <button data-tab="chart" class="tab-btn active">Grafico</button>
      <button data-tab="backtest" class="tab-btn">Backtest</button>
    </nav>
  </header>

  <main>
  <div class="tab-panel" data-tab="chart">
    <aside class="sidebar">
      <section>
        <h2>Asset</h2>
        <label>
          Simbolo
          <select id="symbol">
            <option value="BTC/USDT" selected>BTC/USDT</option>
          </select>
        </label>

        <label>
          Timeframe
          <select id="timeframe">
            <option value="15m">15 minuti</option>
            <option value="1h" selected>1 ora</option>
            <option value="4h">4 ore</option>
            <option value="1d">1 giorno</option>
          </select>
        </label>

        <button id="reload">Aggiorna grafico</button>

        <label class="toggle">
          <input type="checkbox" id="live-toggle" />
          <span>Aggiornamento live</span>
        </label>

        <p id="status" class="status">In attesa…</p>
      </section>

      <section>
        <h2>Indicatori</h2>
        <div class="indicator-add">
          <select id="indicator-type">
            <option value="sma">SMA</option>
            <option value="ema">EMA</option>
            <option value="rsi">RSI</option>
            <option value="macd">MACD</option>
          </select>
          <button id="add-indicator" class="btn-secondary">Aggiungi</button>
        </div>
        <ul id="indicator-list" class="indicator-list"></ul>
      </section>
    </aside>

    <section class="chart-wrap">
      <div class="pane-wrap main-pane">
        <div id="chart"></div>
        <div id="legend-main" class="legend"></div>
      </div>
      <div class="pane-wrap osc-pane hidden">
        <div id="osc-chart"></div>
        <div id="legend-osc" class="legend"></div>
      </div>
    </section>
  </div>

  <div class="tab-panel hidden" data-tab="backtest">
    <aside class="sidebar">
      <section>
        <h2>Strategia</h2>
        <label>
          Preset
          <select id="bt-preset">
            <option value="">— scegli un preset —</option>
            <option value="rsi_rebound">RSI rebound + EMA filter</option>
            <option value="golden_cross">EMA golden cross</option>
            <option value="macd_signal">MACD signal cross</option>
            <option value="ema_short">EMA death cross (short)</option>
            <option value="rsi_short">RSI overbought short</option>
          </select>
        </label>
        <label>
          Modalità operativa
          <select id="bt-mode">
            <option value="both">Long + Short</option>
            <option value="long" selected>Solo Long</option>
            <option value="short">Solo Short</option>
          </select>
        </label>
        <label>
          JSON strategia
          <textarea id="bt-strategy" rows="14" spellcheck="false"></textarea>
        </label>

        <div class="risk-fields">
          <label>Stop loss % (Long)
            <input id="bt-sl-long" type="number" min="0" step="0.1" placeholder="off" />
          </label>
          <label>Take profit % (Long)
            <input id="bt-tp-long" type="number" min="0" step="0.1" placeholder="off" />
          </label>
          <label>Stop loss % (Short)
            <input id="bt-sl-short" type="number" min="0" step="0.1" placeholder="off" />
          </label>
          <label>Take profit % (Short)
            <input id="bt-tp-short" type="number" min="0" step="0.1" placeholder="off" />
          </label>
        </div>
        <p class="hint">Lascia vuoto per disattivare. Valore in % sul prezzo di entry (es. 3 = 3%).</p>
      </section>

      <section>
        <h2>Mercato</h2>
        <label>Simbolo
          <select id="bt-symbol"></select>
        </label>
        <label>Timeframe
          <select id="bt-timeframe">
            <option value="15m">15 minuti</option>
            <option value="1h" selected>1 ora</option>
            <option value="4h">4 ore</option>
            <option value="1d">1 giorno</option>
          </select>
        </label>
        <label>N. candele storiche
          <input id="bt-limit" type="number" min="100" max="1000" step="50" value="500" />
        </label>
      </section>

      <section>
        <h2>Costi</h2>
        <label>Capitale iniziale (USDT)
          <input id="bt-capital" type="number" min="100" step="100" value="10000" />
        </label>
        <label>Fee % per lato
          <input id="bt-fee" type="number" min="0" step="0.01" value="0.1" />
        </label>
        <label>Slippage % per lato
          <input id="bt-slip" type="number" min="0" step="0.01" value="0.05" />
        </label>
      </section>

      <button id="bt-run">Esegui backtest</button>
      <p id="bt-status" class="status">Pronto.</p>
    </aside>

    <section class="bt-content">
      <div id="bt-metrics" class="metrics-grid"></div>
      <div class="pane-wrap bt-pane">
        <div id="bt-chart"></div>
      </div>
      <div class="pane-wrap bt-pane bt-equity">
        <div id="bt-equity-chart"></div>
        <div class="legend bt-equity-legend">Equity curve</div>
      </div>
      <div class="bt-trades-wrap">
        <h3>Trade</h3>
        <div id="bt-trades-table"></div>
      </div>
    </section>
  </div>
  </main>

  <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
  <script src="/app.js"></script>
  <script src="/backtest.js"></script>
</body>
</html>
